<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../_card_loader.js"></script>
<style>body{margin:0;background:var(--tex-page);padding:14px 16px;font-family:var(--font-display);color:var(--text-1)}*{box-sizing:border-box}.lbl{font-size:9px;letter-spacing:0.16em;color:var(--text-4);font-weight:700;font-family:var(--font-mono)}</style>
</head><body><div id="root"></div>
<script type="text/x-app">
const { Button, IconButton, Input, NumberField, Select, Checkbox, Radio, RadioGroup, Switch, Segmented, Badge, Tag, Alert, ProgressBar, Tooltip, Dialog, Gauge, StatCard, DataTable, ChartFrame, Tabs, Breadcrumb, SideNav, Panel } = NS;

function App(){ return (
  <div style={{display:'flex',flexDirection:'column',gap:12}}>
    <div style={{display:'flex',gap:12,alignItems:'stretch'}}>
      <Gauge label="产线利用率" value={72} unit="%" size={104} />
      <Gauge label="功耗" value={86} max={120} unit="MW" tone="danger" size={104} />
      <div style={{flex:1,display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,alignContent:'start'}}>
        <StatCard label="总产率" value="1,240" unit="/min" tone="amber" delta="+8%" />
        <StatCard label="机器总数" value="86" unit="台" />
        <StatCard label="功耗" value="86.4" unit="MW" tone="danger" delta="-3%" />
        <StatCard label="副产物" value="12" unit="/min" tone="info" hint="硫酸 · 回流处理" />
      </div>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'1.2fr 1fr',gap:12}}>
      <DataTable dense rowKey="id"
        columns={[
          {key:'name',title:'物品'},
          {key:'lv',title:'层级',mono:true,align:'center',width:50},
          {key:'rate',title:'速率 /MIN',mono:true,align:'right'},
          {key:'st',title:'状态',align:'right',render:(v)=> <Badge tone={v==='运行中'?'ok':v==='降速'?'warn':'danger'}>{v}</Badge>}]}
        rows={[
          {id:1,name:'电路板',lv:3,rate:'240.0',st:'运行中'},
          {id:2,name:'铜线',lv:2,rate:'720.0',st:'降速'},
          {id:3,name:'铁板',lv:1,rate:'480.0',st:'断供'}]} />
      <ChartFrame title="产率趋势" tag="RATE / MIN" height={148} />
    </div>
  </div>
); }
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
