<!-- @dsCard group="Foundations" viewport="700x148" subtitle="运行/信息/告警/危险 · 方形状态灯" name="语义色" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--tex-page);font-family:var(--font-display);color:var(--text-1);padding:14px 16px;box-sizing:border-box}*{box-sizing:border-box}.mono{font-family:var(--font-mono)}.lbl{font-size:9px;letter-spacing:0.16em;color:var(--text-3);font-weight:700;font-family:var(--font-mono)}</style></head><body><div style="display:flex;gap:10px">
<div style="flex:1;display:flex;flex-direction:column;gap:5px"><div style="height:52px;background:var(--ok-tint);border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;gap:8px"><span style="width:7px;height:7px;background:var(--ok);box-shadow:0 0 5px var(--ok)"></span><span style="color:var(--ok);font-weight:700;font-size:12px">运行 OK</span></div><div class="mono" style="font-size:10px;color:var(--text-3)">--ok #6FBF5E</div></div><div style="flex:1;display:flex;flex-direction:column;gap:5px"><div style="height:52px;background:var(--info-tint);border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;gap:8px"><span style="width:7px;height:7px;background:var(--info);box-shadow:0 0 5px var(--info)"></span><span style="color:var(--info);font-weight:700;font-size:12px">信息 INFO</span></div><div class="mono" style="font-size:10px;color:var(--text-3)">--info #7BA3B8</div></div><div style="flex:1;display:flex;flex-direction:column;gap:5px"><div style="height:52px;background:var(--warn-tint);border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;gap:8px"><span style="width:7px;height:7px;background:var(--warn);box-shadow:0 0 5px var(--warn)"></span><span style="color:var(--warn);font-weight:700;font-size:12px">告警 WARN</span></div><div class="mono" style="font-size:10px;color:var(--text-3)">--warn #C08A2E</div></div><div style="flex:1;display:flex;flex-direction:column;gap:5px"><div style="height:52px;background:var(--danger-tint);border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;gap:8px"><span style="width:7px;height:7px;background:var(--danger);box-shadow:0 0 5px var(--danger)"></span><span style="color:var(--danger);font-weight:700;font-size:12px">危险 DANGER</span></div><div class="mono" style="font-size:10px;color:var(--text-3)">--danger #C25445</div></div></div></body></html>
