<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--tex-page);font-family:var(--font-display);color:var(--text-1);padding:14px 16px;box-sizing:border-box}*{box-sizing:border-box}.mono{font-family:var(--font-mono)}.lbl{font-size:9px;letter-spacing:0.16em;color:var(--text-3);font-weight:700;font-family:var(--font-mono)}</style></head><body><div style="display:flex;gap:24px">
<div style="flex:1"><div class="lbl" style="margin-bottom:8px">板缝线 LINES</div>
<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><div style="flex:1;height:0;border-top:1px solid var(--line-0)"></div><span class="mono" style="font-size:10px;color:var(--text-3);width:140px">--line-0 #000 外描边</span></div><div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><div style="flex:1;height:0;border-top:1px solid var(--line-1)"></div><span class="mono" style="font-size:10px;color:var(--text-3);width:140px">--line-1 #24211A</span></div><div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><div style="flex:1;height:0;border-top:1px solid var(--line-2)"></div><span class="mono" style="font-size:10px;color:var(--text-3);width:140px">--line-2 #2E2A21</span></div><div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><div style="flex:1;height:0;border-top:1px solid var(--line-3)"></div><span class="mono" style="font-size:10px;color:var(--text-3);width:140px">--line-3 #3A352A</span></div><div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><div style="flex:1;height:0;border-top:1px solid var(--line-4)"></div><span class="mono" style="font-size:10px;color:var(--text-3);width:140px">--line-4 #4E4738</span></div></div>
<div style="flex:1"><div class="lbl" style="margin-bottom:8px">文本 TEXT</div>
<div style="display:flex;align-items:baseline;gap:10px;margin-bottom:5px"><span style="color:var(--text-1);font-size:13px;font-weight:700;flex:1">标题与主内容</span><span class="mono" style="font-size:10px;color:var(--text-3)">--text-1 #D9D0BC</span></div><div style="display:flex;align-items:baseline;gap:10px;margin-bottom:5px"><span style="color:var(--text-2);font-size:13px;font-weight:700;flex:1">正文</span><span class="mono" style="font-size:10px;color:var(--text-3)">--text-2 #A69D89</span></div><div style="display:flex;align-items:baseline;gap:10px;margin-bottom:5px"><span style="color:var(--text-3);font-size:13px;font-weight:700;flex:1">标签与次要</span><span class="mono" style="font-size:10px;color:var(--text-3)">--text-3 #746C5A</span></div><div style="display:flex;align-items:baseline;gap:10px;margin-bottom:5px"><span style="color:var(--text-4);font-size:13px;font-weight:700;flex:1">微标注/占位</span><span class="mono" style="font-size:10px;color:var(--text-3)">--text-4 #4C463A</span></div></div></div></body></html>
