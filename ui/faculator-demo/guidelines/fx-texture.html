<!-- @dsCard group="Foundations" viewport="700x160" subtitle="内联 SVG 噪点 + 渐变叠层,无图片文件" name="纯 CSS 材质" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--tex-page);font-family:var(--font-display);color:var(--text-1);padding:14px 16px;box-sizing:border-box}*{box-sizing:border-box}.mono{font-family:var(--font-mono)}.lbl{font-size:9px;letter-spacing:0.16em;color:var(--text-3);font-weight:700;font-family:var(--font-mono)}</style></head><body><div style="display:flex;gap:12px">
<div style="flex:1;display:flex;flex-direction:column;gap:5px"><div style="height:56px;background:var(--tex-page);border:1px solid var(--line-0)"></div><div style="font-size:12px;font-weight:700">页面深底</div><div class="mono" style="font-size:10px;color:var(--text-3)">var(--tex-page) · 径向渐变+噪点</div></div><div style="flex:1;display:flex;flex-direction:column;gap:5px"><div style="height:56px;background:var(--plate);border:1px solid var(--line-0)"></div><div style="font-size:12px;font-weight:700">钢板面</div><div class="mono" style="font-size:10px;color:var(--text-3)">var(--plate) · 线性渐变+噪点</div></div><div style="flex:1;display:flex;flex-direction:column;gap:5px"><div style="height:56px;background:var(--plate-amber);border:1px solid var(--line-0)"></div><div style="font-size:12px;font-weight:700">金琥珀面</div><div class="mono" style="font-size:10px;color:var(--text-3)">var(--plate-amber) · 金渐变+噪点</div></div>
<div style="flex:1;display:flex;flex-direction:column;gap:5px"><div style="height:56px;background:var(--tex-brushed),var(--plate-flat);border:1px solid var(--line-0)"></div><div style="font-size:12px;font-weight:700">拉丝</div><div class="mono" style="font-size:10px;color:var(--text-3)">--tex-brushed 叠加层</div></div></div></body></html>
