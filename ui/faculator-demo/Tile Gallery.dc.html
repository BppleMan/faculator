<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#141518;} a{color:#8FA8B8;} a:hover{color:#C0D0DC;}</style>
</helmet>
<div style="min-height:100vh;background:#141518;padding:40px;font-family:Rajdhani,sans-serif;color:#D6D8DC">
  <h1 style="margin:0 0 4px;font-size:26px;letter-spacing:2px">CONVEYOR TILE · 连接线组件</h1>
  <div style="margin:0 0 28px;font-size:13px;color:#7F8590;font-family:'JetBrains Mono',monospace">16 态（独立 / 单端×4 / 双端×6 / 三端×4 / 十字）× 传送带 / 管道</div>

  <h2 style="margin:0 0 12px;font-size:16px;letter-spacing:1.5px;color:#A6ADB6">传送带 BELT</h2>
  <div style="display:flex;flex-wrap:wrap;gap:18px;margin-bottom:32px">
    <sc-for list="{{states}}" as="s" hint-placeholder-count="16">
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
        <div style="background:#1B1D21;border:1px solid #2A2D33;padding:6px">
          <dc-import name="ConveyorTile" kind="belt" up="{{s.u}}" down="{{s.d}}" left="{{s.l}}" right="{{s.r}}" size="{{tile}}" hint-size="96px,96px"></dc-import>
        </div>
        <div style="font-size:11px;color:#7F8590;font-family:'JetBrains Mono',monospace">{{s.label}}</div>
      </div>
    </sc-for>
  </div>

  <h2 style="margin:0 0 12px;font-size:16px;letter-spacing:1.5px;color:#A6ADB6">管道 PIPE</h2>
  <div style="display:flex;flex-wrap:wrap;gap:18px;margin-bottom:32px">
    <sc-for list="{{states}}" as="s" hint-placeholder-count="16">
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
        <div style="background:#1B1D21;border:1px solid #2A2D33;padding:6px">
          <dc-import name="ConveyorTile" kind="pipe" up="{{s.u}}" down="{{s.d}}" left="{{s.l}}" right="{{s.r}}" size="{{tile}}" hint-size="96px,96px"></dc-import>
        </div>
        <div style="font-size:11px;color:#7F8590;font-family:'JetBrains Mono',monospace">{{s.label}}</div>
      </div>
    </sc-for>
  </div>

  <h2 style="margin:0 0 12px;font-size:16px;letter-spacing:1.5px;color:#A6ADB6">拼接演示 · 无缝连线</h2>
  <div style="display:flex;gap:48px;flex-wrap:wrap">
    <div style="background:#1B1D21;border:1px solid #2A2D33;padding:12px;display:flex;flex-direction:column">
      <sc-for list="{{beltPath}}" as="row" hint-placeholder-count="3">
        <div style="display:flex">
          <sc-for list="{{row}}" as="cell" hint-placeholder-count="6">
            <div style="width:64px;height:64px">
              <sc-if value="{{cell.show}}" hint-placeholder-val="{{true}}">
                <dc-import name="ConveyorTile" kind="belt" up="{{cell.u}}" down="{{cell.d}}" left="{{cell.l}}" right="{{cell.r}}" size="64" hint-size="64px,64px"></dc-import>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </sc-for>
    </div>
    <div style="background:#1B1D21;border:1px solid #2A2D33;padding:12px;display:flex;flex-direction:column">
      <sc-for list="{{pipePath}}" as="row" hint-placeholder-count="3">
        <div style="display:flex">
          <sc-for list="{{row}}" as="cell" hint-placeholder-count="6">
            <div style="width:64px;height:64px">
              <sc-if value="{{cell.show}}" hint-placeholder-val="{{true}}">
                <dc-import name="ConveyorTile" kind="pipe" up="{{cell.u}}" down="{{cell.d}}" left="{{cell.l}}" right="{{cell.r}}" size="64" hint-size="64px,64px"></dc-import>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals(){
    const mk=(label,u,d,l,r)=>({label,u,d,l,r});
    const states=[
      mk('独立',0,0,0,0),
      mk('上',1,0,0,0), mk('下',0,1,0,0), mk('左',0,0,1,0), mk('右',0,0,0,1),
      mk('左右',0,0,1,1), mk('上下',1,1,0,0),
      mk('上右',1,0,0,1), mk('右下',0,1,0,1), mk('下左',0,1,1,0), mk('上左',1,0,1,0),
      mk('下左右',0,1,1,1), mk('上左右',1,0,1,1), mk('上下右',1,1,0,1), mk('上下左',1,1,1,0),
      mk('十字',1,1,1,1),
    ];
    // 0=空, 字符串=连接方向 (u/d/l/r)
    const parse=g=>g.map(row=>row.map(s=>s?{show:true,u:+s.includes('u'),d:+s.includes('d'),l:+s.includes('l'),r:+s.includes('r')}:{show:false}));
    const beltPath=parse([
      ['r','lr','lr','ld',0,0],
      [0,0,0,'ud',0,0],
      [0,0,0,'ur','lr','ldr'],
      [0,0,0,0,0,'ud'],
    ]);
    const pipePath=parse([
      [0,'d',0,'d',0,0],
      ['r','ulr','lr','uld',0,0],
      [0,0,0,'udr','lr','l'],
      [0,0,0,'u',0,0],
    ]);
    return { states, beltPath, pipePath, tile:96 };
  }
}
</script>
</body>
</html>
