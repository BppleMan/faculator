[package]
name = "faculator-x"
version.workspace = true
edition.workspace = true
description = "从 Factorio 游戏数据中提取原型图标"

[[bin]]
name = "facx"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
walkdir = "2"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
texture_packer = { version = "0.30", features = ["png"] }

[dev-dependencies]
tempfile = "3"
