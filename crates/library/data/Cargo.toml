[package]
name = "faculator-data"
version.workspace = true
edition.workspace = true

[dependencies]
faculator-core = { path = "../core" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
rust_decimal = { version = "1.41.0", features = ["serde-float"] }
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
sea-orm = { version = "2.0.0-rc", features = [
    "sqlx-sqlite",
    "runtime-tokio",
    "macros",
    "debug-print",
] }
color-eyre = "0.6.5"
async-trait = "0.1.89"
# faculator-migration = { path = "../faculator-migration" }
